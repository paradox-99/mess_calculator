{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mess Calculator{% endblock %}</title>
    <style>
        :root {
            --ink: #1f2328;
            --muted: #5b6470;
            --border: #d8dce1;
            --accent: #2f6f4f;
            --owe: #b3432b;
            --bg: #fafaf8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            padding: 0.85rem clamp(1rem, 4vw, 3rem);
            border-bottom: 1px solid #d8e2df;
            background: rgba(255, 253, 247, 0.96);
            box-shadow: 0 4px 18px rgba(23, 43, 58, 0.06);
            position: relative;
            z-index: 2;
        }
        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            color: #172b3a;
            text-decoration: none;
        }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 2.35rem;
            height: 2.35rem;
            border-radius: 8px 8px 11px 11px;
            background: #0f4c5c;
            box-shadow: inset 0 -5px 0 #e76f51;
            color: #f2c14e;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: -0.08em;
        }
        .brand-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.15rem;
            font-weight: 700;
        }
        header nav {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        header nav a,
        header nav button {
            padding: 0.45rem 0.7rem;
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
        }
        header nav a:hover,
        header nav a:focus-visible {
            border-color: #a7d8dc;
            background: #effbfc;
            color: #0f4c5c;
            outline: none;
        }
        header nav .nav-login,
        header nav .nav-signup {
            color: #fff;
            font-weight: 800;
        }
        header nav .nav-login {
            background: #0f4c5c;
        }
        header nav .nav-login:hover,
        header nav .nav-login:focus-visible {
            border-color: #0f4c5c;
            background: #0a3b48;
            color: #fff;
        }
        header nav .nav-signup {
            background: #e76f51;
        }
        header nav .nav-signup:hover,
        header nav .nav-signup:focus-visible {
            border-color: #d45c40;
            background: #d45c40;
            color: #fff;
        }
        .logout-form button {
            padding: 0;
            background: transparent;
            color: var(--muted);
            font-size: inherit;
            font-weight: 400;
        }
        .logout-form button:hover,
        .logout-form button:focus-visible {
            color: #e76f51;
            outline: none;
        }
        .user-pill {
            padding: 0.35rem 0.65rem;
            border-radius: 999px;
            background: #f2f7e8;
            color: #315b43;
            font-size: 0.85rem;
            font-weight: 700;
            max-width: 10rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .authenticated-nav .nav-mess { background: #0f4c5c; color: #fff; }
        .authenticated-nav .nav-profile { background: #f2c14e; color: #172b3a; }
        .authenticated-nav .nav-logout { background: #e76f51; color: #fff; }
        .authenticated-nav .nav-mess:hover,
        .authenticated-nav .nav-mess:focus-visible { background: #0a3b48; color: #fff; }
        .authenticated-nav .nav-profile:hover,
        .authenticated-nav .nav-profile:focus-visible { background: #d9aa2f; color: #172b3a; }
        .authenticated-nav .nav-logout:hover,
        .authenticated-nav .nav-logout:focus-visible { background: #d45c40; color: #fff; }
        .authenticated-nav .logout-form .nav-logout { padding: 0.45rem 0.7rem; }
        .mobile-menu { display: none; }
        main { max-width: 1180px; margin: 2rem auto; padding: 0 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: 0.9rem; }
        .positive { color: var(--accent); }
        .negative { color: var(--owe); }
        form p { margin: 0.6rem 0; }
        label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.2rem; }
        input, select { padding: 0.4rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; width: 100%; max-width: 280px; }
        button, .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .errorlist { color: var(--owe); padding-left: 1rem; }
        .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 1.2rem; margin-bottom: 1rem; }
        .muted { color: var(--muted); font-size: 0.9rem; }
        @media (max-width: 680px) {
            header {
                align-items: flex-start;
                flex-wrap: nowrap;
                gap: 0.5rem;
                padding: 0.75rem 1rem;
            }
            header nav {
                flex: 0 0 auto;
                justify-content: flex-end;
                flex-wrap: wrap;
                gap: 0.25rem;
            }
            header nav a,
            header nav button {
                padding: 0.4rem 0.55rem;
                white-space: nowrap;
            }
            .brand-link { gap: 0.5rem; }
            .brand-name {
                font-size: 1rem;
                line-height: 1.1;
            }
            main {
                width: 100%;
                margin: 1.25rem auto;
                padding: 0 1rem;
            }
            h1 { font-size: clamp(1.75rem, 8vw, 2.35rem); }
            .card { padding: 1rem; }
            table { font-size: 0.9rem; }
            th, td { padding: 0.55rem 0.45rem; }
            input, select { max-width: none; }
            header nav.authenticated-nav {
                flex: 0 0 auto;
                justify-content: flex-end;
            }
            header nav.authenticated-nav > .desktop-auth-option,
            header nav.authenticated-nav > .logout-form { display: none; }
            .mobile-menu {
                position: relative;
                display: block;
            }
            .mobile-menu summary {
                display: grid;
                width: 2.7rem;
                height: 2.35rem;
                gap: 0.28rem;
                align-content: center;
                justify-items: center;
                padding: 0.45rem;
                border-radius: 999px;
                background: transparent;
                cursor: pointer;
                list-style: none;
            }
            .mobile-menu summary::-webkit-details-marker { display: none; }
            .mobile-menu summary span {
                display: block;
                width: 1.35rem;
                height: 0.14rem;
                border-radius: 999px;
                background: #1f2328;
            }
            .mobile-menu summary:focus-visible {
                outline: 3px solid rgba(242, 193, 78, 0.75);
                outline-offset: 2px;
            }
            .mobile-menu-panel {
                position: absolute;
                top: calc(100% + 0.5rem);
                right: 0;
                z-index: 5;
                display: grid;
                min-width: 12rem;
                gap: 0.25rem;
                padding: 0.5rem;
                border: 1px solid #d8dce1;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 12px 28px rgba(23, 43, 58, 0.16);
            }
            .mobile-menu-panel a,
            .mobile-menu-panel button {
                width: 100%;
                padding: 0.65rem 0.75rem;
                border: 0;
                border-radius: 5px;
                background: transparent;
                color: var(--ink);
                text-align: left;
                text-decoration: none;
                font-size: 0.9rem;
                font-weight: 600;
            }
            .mobile-menu-panel a:hover,
            .mobile-menu-panel button:hover {
                background: #effbfc;
                color: #0f4c5c;
            }
            .mobile-menu-panel .mobile-user {
                padding: 0.55rem 0.75rem;
                border-bottom: 1px solid #e8eeeb;
                color: #315b43;
                font-size: 0.85rem;
                font-weight: 700;
            }
        }
        @media (max-width: 360px) {
            header {
                align-items: center;
                flex-wrap: wrap;
            }
            header nav {
                flex: 1 1 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand-link" href="{% url 'home' %}" aria-label="Mess Calculator home">
            <span class="brand-mark" aria-hidden="true">MC</span>
            <span class="brand-name">Mess Calculator</span>
        </a>
        <nav class="{% if user.is_authenticated %}authenticated-nav{% endif %}">
            {% if user.is_authenticated %}
                <a class="desktop-auth-option nav-mess" href="{% url 'groups:list' %}">My mess</a>
                <a class="desktop-auth-option nav-profile user-pill" href="{% url 'profile' %}">{{ user.username }}</a>
                <form class="logout-form" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="nav-logout" type="submit">Log out</button>
                </form>
                <details class="mobile-menu">
                    <summary aria-label="Open menu" title="Open menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </summary>
                    <div class="mobile-menu-panel">
                        <a class="mobile-user" href="{% url 'profile' %}">{{ user.username }} — Profile</a>
                        <a href="{% url 'groups:list' %}">My mess</a>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit">Log out</button>
                        </form>
                    </div>
                </details>
            {% else %}
                <a class="nav-login" href="{% url 'login' %}">Log in</a>
                <a class="nav-signup" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
